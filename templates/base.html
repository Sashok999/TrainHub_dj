{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title|default:"TrainHub" }}{% endblock %} | TrainHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">К содержимому</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{% url 'homepage:index' %}">
        <img src="{% static 'homepage/img/logo.svg' %}" alt="" width="36" height="36">
        TrainHub
      </a>
      {% include 'includes/navigation.html' %}
    </div>
  </header>
  <main id="content" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">TrainHub · Учет корпоративного обучения</footer>
</body>
</html>
